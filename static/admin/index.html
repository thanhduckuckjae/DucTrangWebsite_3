<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản trị viên - Đức Trang</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    #back-to-site {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 0 16px !important;
      height: 100% !important;
      color: #666 !important;
      text-decoration: none !important;
      font-size: 14px !important;
      font-family: sans-serif !important;
      white-space: nowrap !important;
      font-weight: 500 !important;
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
    }
    #back-to-site:hover {
      color: #333 !important;
      background: rgba(0,0,0,0.06) !important;
    }
    #back-to-site svg {
      display: inline-block !important;
      vertical-align: middle !important;
      flex-shrink: 0 !important;
    }
    #back-to-site span {
      display: inline-block !important;
      vertical-align: middle !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>
  <script>
    var icon = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';

    function injectButton() {
      if (document.getElementById('back-to-site')) return;

      // Find the "Tập tin" button by looking for the nav link whose href contains "media"
      var allLinks = document.querySelectorAll('a');
      var tapTinLink = null;
      for (var i = 0; i < allLinks.length; i++) {
        var href = allLinks[i].getAttribute('href') || '';
        if (href.includes('media')) {
          tapTinLink = allLinks[i];
          break;
        }
      }

      // Fallback: use top nav by position
      if (!tapTinLink) {
        var navs = document.querySelectorAll('nav');
        var topNav = null;
        var minTop = Infinity;
        navs.forEach(function(nav) {
          var rect = nav.getBoundingClientRect();
          if (rect.height > 0 && rect.top < minTop) {
            minTop = rect.top;
            topNav = nav;
          }
        });
        if (!topNav || minTop > 80) return;

        var btn = document.createElement('a');
        btn.id = 'back-to-site';
        btn.href = 'https://ductrang.net';
        btn.target = '_blank';
        btn.innerHTML = icon + '<span>Home</span>';
        topNav.appendChild(btn);
        return;
      }

      // Insert right after "Tập tin" link
      var btn = document.createElement('a');
      btn.id = 'back-to-site';
      btn.href = 'https://ductrang.net';
      btn.target = '_blank';
      btn.innerHTML = icon + '<span>Home</span>';
      tapTinLink.parentNode.insertBefore(btn, tapTinLink.nextSibling);
    }

    setTimeout(injectButton, 1500);
    setTimeout(injectButton, 3000);

    // Patch file inputs to allow multi-select
    (function () {
      function patchInputs() {
        document.querySelectorAll('input[type="file"]').forEach(function (el) {
          if (!el.hasAttribute('multiple')) {
            el.setAttribute('multiple', '');
          }
        });
      }
      var mo = new MutationObserver(patchInputs);
      mo.observe(document.documentElement, { childList: true, subtree: true });
    }());
  </script>
</body>
</html>
