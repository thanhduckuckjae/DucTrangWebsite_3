<header class="header">
	<div class="container">
		<div class="logo">
			<a href="{{ "" | relLangURL }}" rel="home" class="logo__img-link">
				<img class="logo__img" src="/img/company/Logo/IMG_1759475252045_1759475877370.jpg" alt="{{ .Site.Title }}">
			</a>
			<a class="logo__link" href="{{ "" | relLangURL }}" title="{{ .Site.Title }}" rel="home">
				<div class="logo__title">{{ .Site.Title }}</div>
				{{ with .Site.Params.subtitle }}<div class="logo__tagline">{{ . }}</div>{{ end }}
			</a>
		</div>
		{{ partial "menu.html" . }}
	</div>
</header>
